/* =====================================================
   HITUNG PROGRESS DPD
===================================================== */

/*
   10 KOMPONEN:

   1. Ketua
   2. Sekretaris
   3. Bendahara
   4. Sekretariat
   5. Politik
   6. Hukum
   7. Sosial Kemasyarakatan
   8. Keorganisasian
   9. Humas & Media
   10. Ekonomi Kreatif
*/

function calculateDPD(dpd){

 const data =
 bidangs.filter(
  b =>
  String(b.dpd_id) ===
  String(dpd.id)
 );


 let total=0;


 /* 4 STRUKTUR UTAMA */

 if(
  String(dpd.ketua||"").trim()
 )
 total += 1;

 if(
  String(dpd.sekretaris||"").trim()
 )
 total += 1;

 if(
  String(dpd.bendahara||"").trim()
 )
 total += 1;

 if(
  String(dpd.sekretariat||"").trim()
 )
 total += 1;


 /* 6 BIDANG */

 BIDANG_LIST.forEach(nama=>{

  const bidang =
  data.find(
   b =>
   String(b.bidang||"")
   .trim()
   .toLowerCase()
   ===
   nama
   .trim()
   .toLowerCase()
  );


  if(bidang){

   let progress =
   Number(bidang.progress)||0;

   progress =
   Math.max(
    0,
    Math.min(
     100,
     progress
    )
   );

   total += progress / 100;

  }

 });


 /*
   10 KOMPONEN
 */

 const progress =
 Math.round(
  (total / 10) * 100
 );


 let status="BELUM TERBENTUK";


 if(progress===100){

  status="SUDAH TERBENTUK";

 }

 else if(progress>0){

  status="DALAM PROSES";

 }


 return {
  progress,
  status
 };

}

/* =====================================================
   RENDER
===================================================== */

function render(){

 let proses=0;
 let terbentuk=0;
 let belum=0;


 dpds.forEach(dpd=>{

  const hasil =
  calculateDPD(dpd);


  if(hasil.progress===100){

   terbentuk++;

  }

  else if(hasil.progress>0){

   proses++;

  }

  else{

   belum++;

  }

 });


 $("jumlahDpd").textContent =
 dpds.length;


 $("dalamProses").textContent =
 proses;


 $("sudahTerbentuk").textContent =
 terbentuk;


 $("belumAda").textContent =
 belum;


 $("monitoringData").innerHTML =

 dpds.length

 ?

 dpds
 .map(dpdCard)
 .join("")

 :

 `<div class="small">
   Data DPD belum tersedia.
  </div>`;

}

/* =====================================================
   LOAD DATABASE
===================================================== */

async function load(){

 try{

  const [d,b] =
  await Promise.all([


   db
   .from("DPD")
   .select("*")
   .order("id"),


   db
   .from("BIDANG_DPD")
   .select("*")
   .order("dpd_id")
   .order("id")


  ]);


  if(d.error){

   console.error(
    "DPD ERROR:",
    d.error
   );

   initMap();

   return;

  }


  dpds =
  d.data || [];


  if(b.error){

   console.error(
    "BIDANG_DPD ERROR:",
    b.error
   );

   bidangs=[];

  }

  else{

   bidangs =
   b.data || [];

  }


  render();


  initMap();


 }

 catch(error){

  console.error(
   "SYSTEM ERROR:",
   error
  );


  initMap();

 }

}
