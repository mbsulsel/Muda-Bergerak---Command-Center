<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f3f3;
 color:#222
}

.page{display:none;min-height:100vh}
.page.active{display:block}

/* HEADER */
.header{
 background:#222;
 color:#fff;
 text-align:center;
 padding:18px 12px 16px
}

.logo{
 width:82px;
 height:82px;
 object-fit:contain;
 display:block;
 margin:0 auto 8px;
 background:transparent;
 border:0;
 border-radius:0;
 padding:0
}

.header h1{
 margin:0;
 font-size:18px;
 font-weight:800
}

.header h2{
 margin:4px 0;
 font-size:15px;
 color:#ff7900
}

.header p{
 margin:0;
 font-size:11px;
 color:#ccc
}

/* MENU */
.nav{
 display:flex;
 gap:6px;
 overflow-x:auto;
 padding:8px;
 background:#fff;
 position:sticky;
 top:0;
 z-index:999;
 border-bottom:1px solid #ddd
}

.nav button{
 border:0;
 border-radius:8px;
 padding:9px 11px;
 white-space:nowrap;
 font-size:12px;
 background:#eee;
 cursor:pointer
}

.nav button:hover{
 background:#ff7900;
 color:#fff
}

/* CONTENT */
.container{
 max-width:1100px;
 margin:auto;
 padding:15px
}

.card{
 background:#fff;
 border-radius:13px;
 padding:16px;
 margin-bottom:14px;
 box-shadow:0 2px 8px #0001
}

.card h3{
 margin:0 0 12px;
 color:#ff7900
}

/* RINGKASAN */
.summary{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:10px
}

.stat{
 background:#fff;
 border-radius:12px;
 padding:16px 8px;
 text-align:center;
 box-shadow:0 2px 7px #0001
}

.stat b{
 display:block;
 font-size:25px;
 color:#ff7900;
 margin-bottom:5px
}

.stat span{
 font-size:11px
}

/* DPD */
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
 gap:12px
}

.dpd{
 background:#fff;
 border-left:5px solid #ff7900;
 border-radius:10px;
 padding:13px;
 box-shadow:0 2px 6px #0001
}

.dpd h4{
 margin:0 0 8px
}

.small{
 font-size:12px;
 color:#666;
 line-height:1.6
}

.progress{
 height:8px;
 background:#eee;
 border-radius:10px;
 overflow:hidden;
 margin:8px 0 4px
}

.progress i{
 display:block;
 height:100%;
 background:#ff7900
}

/* STRUKTUR */
.structure{
 margin-top:10px;
 background:#fafafa;
 border:1px solid #eee;
 border-radius:9px;
 padding:10px
}

.structure-title{
 color:#ff7900;
 font-weight:bold;
 margin-bottom:7px
}

.structure-item{
 padding:7px 0;
 border-bottom:1px solid #eee
}

.structure-item:last-child{
 border-bottom:0
}

/* MAP */
#map{
 width:100%;
 height:430px;
 border-radius:12px
}

/* QRIS */
.qris{
 width:100%;
 max-width:330px;
 display:block;
 margin:15px auto;
 border-radius:10px
}

/* FORM */
input,textarea{
 width:100%;
 padding:11px;
 border:1px solid #ddd;
 border-radius:8px;
 margin:6px 0 10px;
 font:inherit
}

textarea{
 min-height:110px
}

.btn{
 border:0;
 background:#ff7900;
 color:#fff;
 padding:12px 18px;
 border-radius:8px;
 font-weight:bold;
 cursor:pointer

/* FOOTER */
.footer{

 background:#222;

.copy{

<script>

const SUPABASE_URL =

const SUPABASE_KEY =
"sb_publishable_ZfZ1m8X7gadvnoAQh9XmNg_hyupNK6b";

const db =
supabase.createClient(SUPABASE_URL,SUPABASE_KEY);


/* =========================
   STORAGE
========================= */

const BUCKET="QRIS";

const LOGO_FILE=
"1788609943842.jpg";

const QRIS_FILE=
"IMG-20260721-WA0038.jpg";

const logo=
db.storage

.data.publicUrl;

const qris=
db.storage

/* =========================
   DATA
========================= */

let dpds=[];
let bidangs=[];
let map;

const $=id=>
document.getElementById(id);


/* =========================
   MENU
========================= */

const menus=[
 ["dashboard","🏠 Dashboard"],
 ["monitoring","📊 Monitoring"],
 ["pemberitahuan","🔔 Pemberitahuan"],
 ["laporan","📑 Laporan"],
 ["agenda","📅 Agenda"],

/* =========================

========================= */

function header(){

 return `

  <h2>
   COMMAND CENTER
  </h2>

   Pusat Informasi dan Koordinasi Organisasi
  </p>

 <nav class="nav">

  <button onclick="show('${m[0]}')">

}


/* =========================
   FOOTER
========================= */

function footer(){

 return `

  <div class="footer-title">

 </footer>
 `;
}


/* =========================
   PINDAH TAB
========================= */

function show(id){

 document
 .querySelectorAll(".page")
 .forEach(p=>p.classList.remove("active"));

 $(id).classList.add("active");

 window.scrollTo(0,0);

 if(id==="dashboard" && map){

  setTimeout(
   ()=>map.invalidateSize(),
   200
  );

 }
}


/* =========================
   HALAMAN
========================= */

function makePages(){

 /* DASHBOARD */

 $("dashboard").innerHTML=

 header()+`

 <main class="container">

  <div class="card">

   <h3>📊 Ringkasan</h3>

   <div class="summary">

    <div class="stat">
     <b id="jumlahDpd">0</b>

    </div>

    <div class="stat">

    </div>

    <div class="stat">

    </div>

    <div class="stat">

    </div>

  </div>


  <div class="card">

   <h3>
    🗺️ Peta Sebaran 24 DPD
   </h3>

   <div id="map"></div>

  <div class="card">

 /* MONITORING */

 $("monitoring").innerHTML=

   <p class="small">
    Monitoring perkembangan pembentukan
    DPD Muda Bergerak Sulawesi Selatan.
   </p>

  </div>

 ${footer()}
 `;


 /* PEMBERITAHUAN */

 $("pemberitahuan").innerHTML=

 header()+`

 <main class="container">

  <div class="card">

   <h3>🔔 Pemberitahuan</h3>

   <p>
    Belum ada pemberitahuan baru.
   </p>

  </div>

 </main>

 ${footer()}
 `;


 /* LAPORAN */

 $("laporan").innerHTML=

 header()+`

 <main class="container">

  <div class="card">

   <h3>📑 Laporan</h3>

   <p>
    Modul laporan kegiatan dan perkembangan
    DPD Muda Bergerak Sulawesi Selatan.
   </p>

   <p class="small">
    Modul laporan dapat dikembangkan
    pada tahap berikutnya.
   </p>

  </div>

 </main>

 ${footer()}
 `;


 /* AGENDA */

 $("agenda").innerHTML=

 header()+`

 <main class="container">

  <div class="card">

   <h3>📅 Agenda</h3>

   <p>
    Agenda kegiatan DPW dan DPD
    Muda Bergerak Sulawesi Selatan.
   </p>

   <p class="small">
    Belum ada agenda yang ditambahkan.
   </p>

  </div>

 </main>

 ${footer()}
 `;


 /* SUPPORT */

 $("support").innerHTML=

 header()+`

 <main class="container">

  <div
   class="card"
   style="text-align:center">

   <h3>🤝 Support Us</h3>

   <p>
    Dukung gerakan Muda Bergerak
    Sulawesi Selatan.
   </p>

   <img
    src="${qris}"
    class="qris"
    alt="QRIS Muda Bergerak">

   <p class="small">
    Scan QRIS di atas untuk
    memberikan dukungan.
   </p>

  </div>

 </main>

 ${footer()}
 `;


 /* JOIN */

 $("join").innerHTML=

 header()+`

 <main class="container">

  <div class="card">

   <h3>🚀 Join With Us</h3>

   <p>
    Bergabung bersama Muda Bergerak
    Sulawesi Selatan.
   </p>

   <label>Nama</label>

   <input
    id="nama"
    placeholder="Nama lengkap">

   <label>Domisili</label>

   <input
    id="domisili"
    placeholder="Kabupaten/Kota">

   <label>
    Alasan Ingin Bergabung
   </label>

   <textarea
    id="alasan"
    placeholder="Tuliskan alasan ingin bergabung">
   </textarea>

   <button
    class="btn"
    onclick="joinWA()">

    Hubungi Kami

   </button>

  </div>

 </main>

 ${footer()}
 `;
}


/* =========================
   KARTU DPD + STRUKTUR
========================= */

function card(x){

 const related=
 bidangs.filter(
  b=>String(b.dpd_id)===String(x.id)
 );

 let struktur="";

 if(related.length){

  struktur=`

  <div class="structure">

   <div class="structure-title">
    Struktur Bidang
   </div>

   ${related.map(b=>`

    <div class="structure-item">

     <strong>
      ${b.bidang||"-"}
     </strong>

     <div class="small">

      Koor. Bidang:
      ${b.koor_bidang||"-"}<br>

      Anggota:
      ${b.anggota_bidang||"-"}<br>

      Status:
      ${b.status||"-"}<br>

      Progress:
      ${b.progress||0}%

     </div>

    </div>

   `).join("")}

  </div>

  `;
 }

 return `

 <div class="dpd">

  <h4>
   ${x.nama||"-"}
  </h4>

  <div class="small">

   Status:
   <strong>
    ${x.status||"BELUM TERBENTUK"}
   </strong>

   <br>

   Ketua:
   ${x.ketua||"-"}

   <br>

   Sekretariat:
   ${x.sekretariat||"-"}

   <br>

   Progress:
   ${x.progress||0}%

  </div>

  <div class="progress">

   <i
    style="width:${Math.min(
     100,
     Number(x.progress)||0
    )}%">
   </i>

  </div>

  ${struktur}

 </div>

 `;
}


/* =========================
   RENDER DATA
========================= */

function render(){

 /* JUMLAH DPD */

 $("jumlahDpd").textContent=
 dpds.length;


 /* DALAM PROSES */

 const proses=
 dpds.filter(x=>
  /PROSES/i.test(x.status||"")
 ).length;

 $("dalamProses").textContent=
 proses;


 /* SUDAH TERBENTUK */

 const terbentuk=
 dpds.filter(x=>
  /TERBENTUK|SIAP|INAUGURASI/i
  .test(x.status||"")
 ).length;

 $("sudahTerbentuk").textContent=
 terbentuk;


 /* BELUM ADA */

 const belum=
 dpds.filter(x=>
  /BELUM/i.test(x.status||"")
 ).length;

 $("belumAda").textContent=
 belum;


 /* DATA */

 const html=
 dpds.map(card).join("");

 $("dataDpd").innerHTML=
 html;

 $("monitoringData").innerHTML=
 html;
}


/* =========================
   24 TITIK KOORDINAT
========================= */

const coords=[

 ["Kota Makassar",-5.13307,119.40810],

 ["Kota Parepare",-4.0135,119.6255],

 ["Kota Palopo",-2.9996,120.1985],

 ["Kab. Bantaeng",-5.5167,120.0167],

 ["Kab. Barru",-4.4333,119.6167],

 ["Kab. Bone",-4.5383,120.3279],

 ["Kab. Takalar",-5.4167,119.4500],

 ["Kab. Tana Toraja",-3.1000,119.8000],

 ["Kab. Toraja Utara",-2.9500,119.9000],

 ["Kab. Wajo",-4.0000,120.1167]

];


/* =========================
   PETA
========================= */

function initMap(){

 map=
 L.map("map")
 .setView([-4.6,120.1],8);

 L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
   maxZoom:18,
   attribution:"© OpenStreetMap"
  }
 ).addTo(map);


 coords.forEach(c=>{

  L.marker([
   c[1],
   c[2]
  ])
  .addTo(map)
  .bindPopup(`
   <b>${c[0]}</b>
  `);

 });

}


/* =========================
   LOAD SUPABASE
========================= */

async function load(){

 const [d,b]=
 await Promise.all([

  db
  .from("DPD")
  .select("*")
  .order("id"),

  db
  .from("BIDANG_DPD")
  .select("*")
  .order("id")

 ]);


 if(d.error){

  console.error(d.error);

  alert(
   "Data DPD gagal dimuat dari Supabase."
  );

  return;
 }


 dpds=d.data||[];

 bidangs=
 b.error
 ? []
 : (b.data||[]);


 render();

 initMap();
}


/* =========================
   WHATSAPP JOIN
========================= */

function joinWA(){

 const nama=
 $("nama").value.trim();

 const domisili=
 $("domisili").value.trim();

 const alasan=
 $("alasan").value.trim();


 if(
  !nama||
  !domisili||
  !alasan
 ){

  alert(
   "Mohon lengkapi semua data."
  );

  return;
 }


 const pesan=
 `Halo Muda Bergerak Sulawesi Selatan,

Saya ingin bergabung dengan Muda Bergerak.

Nama : ${nama}
Domisili : ${domisili}
Alasan Ingin Bergabung : ${alasan}

Terima kasih.`;


 location.href=
 "https://wa.me/6285314241908?text="+
 encodeURIComponent(pesan);
}


/* =========================
   START
========================= */

makePages();

load();

</script>
